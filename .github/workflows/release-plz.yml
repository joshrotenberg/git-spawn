name: Release

permissions:
  actions: write
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Events produced with GITHUB_TOKEN do not start unattended downstream
      # workflows. workflow_dispatch is an explicit exception, and dispatching at
      # the release branch associates both checks with its exact head commit.
      - name: Dispatch checks for the release pull request
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          head_branch=$(jq -er '.head_branch' <<<"$RELEASE_PR")

          gh workflow run ci.yml --ref "$head_branch"
          gh workflow run pr-title.yml --ref "$head_branch"
